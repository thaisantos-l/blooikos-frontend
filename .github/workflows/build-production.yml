name: Frontend build artifact
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blooikos-code-build-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  build:
    if: github.repository == 'thaisantos-l/blooikos-frontend' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORDPRESS_GRAPHQL_URL: ${{ vars.WORDPRESS_GRAPHQL_URL }}
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      CMS_REBUILD_VERSION_URL: ${{ vars.CMS_REBUILD_VERSION_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Capture consistent CMS snapshot
        id: capture
        continue-on-error: true
        run: pnpm build
      - name: Editorial content rejected
        if: steps.capture.outcome == 'failure' && steps.capture.outputs.failure_category == 'editorial'
        run: exit 1
      - name: Build or capture failed
        if: steps.capture.outcome == 'failure' && steps.capture.outputs.failure_category != 'editorial'
        run: exit 1
      - run: pnpm verify:export
      - id: package
        run: |
          export DEPLOY_BUILD_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pnpm deploy:package
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blooikos-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .deploy/release.zip
            .deploy/release.sha256
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
