name: Frontend production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blooikos-frontend-production
  cancel-in-progress: true

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  build:
    if: github.repository == 'thaisantos-l/blooikos-frontend' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    env:
      WORDPRESS_GRAPHQL_URL: ${{ vars.WORDPRESS_GRAPHQL_URL }}
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate project
        run: pnpm check

      - name: Validate CMS content
        run: pnpm validate:poc

      - name: Build static frontend
        run: pnpm build

      - name: Verify static export
        run: pnpm verify:export

      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: blooikos-static-${{ github.sha }}-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  publish:
    needs: build
    if: needs.build.result == 'success'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download static export
        uses: actions/download-artifact@v4
        with:
          name: blooikos-static-${{ github.sha }}-${{ github.run_id }}
          path: out/

      - name: Configure SSH
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" \
            > ~/.ssh/blooikos_deploy

          printf '%s\n' "${{ secrets.HOSTINGER_KNOWN_HOSTS }}" \
            > ~/.ssh/known_hosts

          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/blooikos_deploy ~/.ssh/known_hosts

      - name: Verify Hostinger destination
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USER }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          TARGET: ${{ vars.HOSTINGER_PATH }}
        run: |
          set -euo pipefail

          ssh -F /dev/null \
            -i ~/.ssh/blooikos_deploy \
            -p "$PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$USER@$HOST" \
            "test -d '$TARGET' && test -d '$TARGET/cms'"

      - name: Deploy static frontend
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USER }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          TARGET: ${{ vars.HOSTINGER_PATH }}
        run: |
          set -euo pipefail

          rsync -az --delete --delay-updates \
            --exclude='cms/' \
            --exclude='.well-known/' \
            --exclude='.htaccess' \
            -e "ssh -F /dev/null \
              -i $HOME/.ssh/blooikos_deploy \
              -p $PORT \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            out/ \
            "$USER@$HOST:$TARGET/"

      - name: Confirm CMS was preserved
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USER }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          TARGET: ${{ vars.HOSTINGER_PATH }}
        run: |
          set -euo pipefail

          ssh -F /dev/null \
            -i ~/.ssh/blooikos_deploy \
            -p "$PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$USER@$HOST" \
            "test -d '$TARGET/cms' && test -f '$TARGET/index.html'"

      - name: Smoke test
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        run: |
          curl --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            "$SITE_ORIGIN/" \
            > /dev/null