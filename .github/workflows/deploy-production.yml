name: Frontend production
run-name: Code ${{ inputs.operation }} build ${{ inputs.build_run_id }} artifact ${{ inputs.artifact_id }}
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful main build run ID
        type: string
        required: true
      artifact_id:
        description: Artifact ID produced by that build attempt
        type: string
        required: true
      operation:
        description: Deploy current main, or explicitly roll back to an integrated build
        type: choice
        options: [deploy, rollback]
        default: deploy
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: blooikos-frontend-production
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  publish:
    if: github.repository == 'thaisantos-l/blooikos-frontend' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      BUILD_ARTIFACT_ID: ${{ inputs.artifact_id }}
      CODE_OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Select trusted build artifact by ID
        run: python3 scripts/deploy/select_artifact.py

      - name: Verify and extract release artifact
        id: artifact
        run: python3 scripts/deploy/confirm.py prepare

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" \
            > ~/.ssh/blooikos_deploy

          printf '%s\n' "${{ secrets.HOSTINGER_KNOWN_HOSTS }}" \
            > ~/.ssh/known_hosts

          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/blooikos_deploy
          chmod 600 ~/.ssh/known_hosts

      - name: Verify Hostinger destination
        shell: bash
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USER }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          TARGET: ${{ vars.HOSTINGER_PATH }}
        run: |
          set -euo pipefail

          ssh \
            -F /dev/null \
            -i ~/.ssh/blooikos_deploy \
            -p "$PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$USER@$HOST" \
            "test -d '$TARGET' && test -d '$TARGET/cms'"

      - name: Deploy static frontend
        shell: bash
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USER }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          TARGET: ${{ vars.HOSTINGER_PATH }}
        run: |
          set -euo pipefail

          rsync \
            -az --checksum --no-times \
            --delete \
            --delay-updates \
            --exclude='cms/' \
            --exclude='blooikos-static/' \
            --exclude='.well-known/' \
            --exclude='.htaccess' \
            -e "ssh -F /dev/null \
              -i $HOME/.ssh/blooikos_deploy \
              -p $PORT \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            .deploy/extracted/site/ \
            "$USER@$HOST:$TARGET/"

      - name: Confirm deployment
        shell: bash
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USER }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          TARGET: ${{ vars.HOSTINGER_PATH }}
        run: |
          set -euo pipefail

          ssh \
            -F /dev/null \
            -i ~/.ssh/blooikos_deploy \
            -p "$PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$USER@$HOST" \
            "test -d '$TARGET/cms' && test -f '$TARGET/index.html'"

      # Confirmation binds the public code release to the selected build artifact.
      - name: Confirm artifact over HTTP index=${{ steps.artifact.outputs.index_sha256 }} marker=${{ steps.artifact.outputs.marker_sha256 }}
        run: python3 scripts/deploy/confirm.py confirm
